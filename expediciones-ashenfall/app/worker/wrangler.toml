# Un solo despliegue: la app estática (dist/) + la API (/api/*).
name = "expediciones-ashenfall"
main = "index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# La base de conocimiento se empaqueta como texto.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Sincronización de progreso. Crea el namespace una vez con:
#   npx wrangler kv namespace create SYNC
# y pega aquí el id que te devuelve.
[[kv_namespaces]]
binding = "SYNC"
id = "REEMPLAZA_CON_EL_ID_DE_TU_KV"

# Secretos (nunca en este archivo):
#   npx wrangler secret put ANTHROPIC_API_KEY --config worker/wrangler.toml
#   npx wrangler secret put APP_PASSWORD      --config worker/wrangler.toml   (opcional)
# En local van en worker/.dev.vars (está en .gitignore).

[vars]
CLAUDE_MODEL = "claude-opus-5-5"
CLAUDE_EFFORT = "low"
