<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#15110c" />
    <meta name="description" content="Cuaderno de cartógrafo para completar al 100% el mapa de RuneScape: Dragonwilds." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Expediciones de Ashenfall</title>
    <script>
      // Aplica el tema antes de pintar para evitar el parpadeo
      try {
        var t = JSON.parse(localStorage.getItem('ashenfall-v5') || '{}').theme || 'auto';
        if (t !== 'auto') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
